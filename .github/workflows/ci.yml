name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check app agents mcp_server tests evaluation
      - name: Compile optional integration modules
        run: python -m compileall -q app agents mcp_server
      - name: Test
        run: pytest --cov=app --cov-report=term-missing
      - name: Evaluation regression
        run: python -m evaluation.run
      - name: Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform
