name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: hashicorp/setup-terraform@v3
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          ruff check app agents mcp_server tests evaluation --output-format=concise \
            | tee lint-report.txt
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          if-no-files-found: warn
      - name: Compile optional integration modules
        run: python -m compileall -q app agents mcp_server
      - name: Test
        run: pytest --cov=app --cov-report=term-missing
      - name: Evaluation regression
        run: python -m evaluation.run
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/report.json
          if-no-files-found: warn
      - name: Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform
