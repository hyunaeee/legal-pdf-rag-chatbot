[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-policy-agent"
version = "0.6.0"
description = "Production-oriented policy and compliance RAG service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<6",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ai = [
  "google-adk>=2.0,<3",
  "google-genai>=1.0,<2",
  "mcp>=1.0,<2",
  "chromadb>=1.0,<2",
]
observability = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-logging>=0.48b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]
legacy = [
  "langchain>=0.3,<1",
  "langchain-chroma>=0.2,<1",
  "langchain-upstage>=0.6,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Header",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
